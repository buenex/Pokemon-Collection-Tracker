<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Pokémon Manager</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
        rel="stylesheet">
    <link
        rel="stylesheet"
        href="https://cdn.datatables.net/1.13.8/css/dataTables.bootstrap5.min.css">
    <link href="./style.css" rel="stylesheet">
</head>
<body>
    <main class="container py-5">
        <div class="d-flex justify-content-center mb-2" id="auth-area"></div>
        <div class="row mb-4">
            <div class="col-lg-10 mx-auto">
                <div class="card p-4">
                    <h4 class="section-title mb-3">Meus Pokémons</h4>
                    <div class="d-flex gap-4 mb-3">
                        <div>
                            <strong>Have:</strong>
                            <span id="count-have">0</span>
                        </div>
                        <div>
                            <strong>Haven't:</strong>
                            <span id="count-missing">0</span>
                        </div>
                    </div>
                    <div class="d-flex gap-2 mb-3">
                        <button id="importData" class="btn btn-success btn-sm">
                            Import data
                        </button>
                        <input
                            type="file"
                            id="importFile"
                            accept=".json,application/json"
                            hidden
                        >
                        <button id="exportData" class="btn btn-primary btn-sm">
                            Export data
                        </button>
                        <button id="exportDontHave" class="btn btn-outline-secondary btn-sm">
                            Export dont have
                        </button>
                    </div>
                    <div class="table-responsive">
                        <table
                            id="pokemonTable"
                            class="table table-hover align-middle">
                            <thead>
                                <tr>
                                    <th>Have</th>
                                    <th>Sprite</th>
                                    <th>Pokémon</th>
                                    <th>ID</th>
                                    <th>Generation</th>
                                    <th>Game</th>
                                </tr>
                            </thead>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.8/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.8/js/dataTables.bootstrap5.min.js"></script>
    <script src="src/config.js"></script>
    <script src="src/api.js"></script>
    <script src="src/main.js"></script>
    <script src="./script.js"></script>
</body>
</html>
