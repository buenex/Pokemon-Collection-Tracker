<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Pokémon Manager</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="./style.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.8/css/dataTables.bootstrap5.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.8/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.8/js/dataTables.bootstrap5.min.js"></script>
    <script src="./script.js"></script>
</head>
<body>
    <div class="container py-5">
        <div class="row mb-4">
            <div class="col-lg-10 mx-auto">
                <div class="card p-4">
                    <h4 class="section-title mb-3">Buscar Pokémon</h4>
                    <div class="row g-3">
                        <div class="col-md-3">
                            <label class="form-label">ID</label>
                            <input type="number" class="form-control" placeholder="Ex: 25" id="id">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Pokémon</label>
                            <input type="text" class="form-control" placeholder="Ex: Pikachu" id="name">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Generation</label>
                            <div class="dropdown">
                                <button class="btn btn-outline-secondary dropdown-toggle w-100 text-start" type="button"
                                    id="generationDropdown" data-bs-toggle="dropdown" aria-expanded="false">Generations</button>
                                <ul class="dropdown-menu w-100 p-2" aria-labelledby="generationDropdown" id="gen-list">
                                </ul>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Game</label>
                            <div class="dropdown w-100">
                                <button class="btn btn-outline-secondary dropdown-toggle w-100 text-start" type="button"
                                    id="gameDropdown" data-bs-toggle="dropdown" aria-expanded="false">--EMPTY--</button>
                                <ul class="dropdown-menu w-100 p-2" aria-labelledby="gameDropdown" id="game-list">
                                    <li class="mb-2">
                                        <input type="text" class="form-control" placeholder="Digite para filtrar..."
                                            onkeyup="filterDropdownGame(this)">
                                    </li>
                                    <li>
                                        <a class="dropdown-item text-muted" href="#" data-value="">
                                            Todos
                                        </a>
                                    </li>
                                    <li><a class="dropdown-item" href="#" data-value="Red">Red</a></li>
                                    <li><a class="dropdown-item" href="#" data-value="Blue">Blue</a></li>
                                    <li><a class="dropdown-item" href="#" data-value="Gold">Gold</a></li>
                                </ul>
                            </div>
                        </div>

                        <button class="btn btn-primary mt-4" onclick="search()">Buscar</button>
                    </div>
                </div>
            </div>
            <div class="col-lg-10 mx-auto">
                <div class="card p-4">
                    <h4 class="section-title mb-3">Meus Pokémons</h4>
                    <div class="table-responsive">
                        <table class="table table-hover align-middle" id="pokemonTable">
                            <thead>
                                <tr>
                                    <th>Sprite</th>
                                    <th>ID</th>
                                    <th>Pokémon</th>
                                    <th>Generation</th>
                                    <th>Game</th>
                                    <th>Have</th>
                                </tr>
                            </thead>
                            <tbody id="pokemon-list">
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
